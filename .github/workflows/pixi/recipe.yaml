schema_version: 1

context:
  version: "4.64.0"

package:
  name: nxstools
  version: ${{ version }}

source:
  - path: ../../../

build:
  number: 0
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation
    - echo "export MYTANGO_PREFIX=$PREFIX/bin" > /home/tango/.env
    - python test


requirements:
  host:
    - python
    - setuptools >=61
    - pip
    - wheel
    - numpy
    - argcomplete
    - lxml
    - pytz
    - pyyaml
    - pytango
    - python-dateutil
    - pninexus
    - fabio
    - h5py
    - matplotlib-base
    - blissdata
    - pytest
    - docutils
    - nxsconfigserver
    - nxswriter
    - nxsrecselector
    - pymysql
  run:
    - python
    - numpy
    - argcomplete
    - lxml
    - pytz
    - pyyaml
    - pytango
    - python-dateutil
    - pninexus
    - fabio
    - h5py
    - matplotlib-base
    - blissdata
    - docutils
    # - blissdata-h5file-detector



about:
  homepage: https://github.com/nexdatas/nxstools
  repository: https://github.com/nexdatas/nxstools
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: NeXDaTaS configuration tools (nxsconfig, nxscreate, nxsdata, nxscollect, nxsetup, nxsfileinfo)
  description: |
    Command-line tools for Nexus Data Writer - python3 module
    It provides command-line tools to communicate with Tango servers:
    NXSDataWriter and NXSConfigServer as well as to create simple
    datasources and components containing writer's configuration.
    It contains also python modules used by NXSDataWriter server
    to write NeXus files and publish metadata into blissdata.

extra:
  recipe-maintainers:
    - jkotan
